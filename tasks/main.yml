---
- name: Install dependencies
  become: yes
  apt:
    pkg: [ca-certificates, default-jre-headless, lsof, procps]
    update_cache: yes
    cache_valid_time: 3600

- name: Create User
  become: yes
  user: name="{{ solr_user }}" system=yes shell=/bin/bash

- name: Check installation
  stat: path="/opt/{{ solr_filename }}"
  register: solr_installed

- name: Download
  become: yes
  get_url:
    url: "{{ solr_url }}/{{ solr_filename }}{{ solr_filename_extension }}"
    dest: "/tmp/{{ solr_filename }}{{ solr_filename_extension }}"
    checksum: "sha512:{{ solr_url }}/{{ solr_filename }}{{ solr_filename_extension }}.sha512"
  when: not solr_installed.stat.exists

- name: Unarchive
  become: yes
  unarchive:
    src: "/tmp/{{ solr_filename }}{{ solr_filename_extension }}"
    dest: /opt
    remote_src: yes
  when: not solr_installed.stat.exists

- name: Remove tmp files
  become: yes
  file: path="/tmp/{{ solr_filename }}{{ solr_filename_extension }}" state=absent

- name: Apply permissions into unarchived file
  become: yes
  file: path="/opt/{{ solr_filename }}" owner="{{ solr_user }}" recurse=yes

- name: Link folder
  become: yes
  file: src="/opt/{{ solr_filename }}" dest="{{ solr_path }}" state=link
  notify: restart

- name: Create /var folders
  become: yes
  file: path="{{ item }}" owner="{{ solr_user }}" group="{{ solr_user }}" state=directory
  loop:
    - "{{ solr_var_path }}"
    - "{{ solr_var_path }}/data"
    - /var/log/solr

- name: Copy Solr files config
  become: yes
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: yes
    force: no
    owner: "{{ solr_user }}"
    group: "{{ solr_user }}"
  loop:
    - { src: "{{ solr_path }}/server/solr/solr.xml", dest: "{{ solr_var_path }}/data/solr.xml" }
    - { src: "{{ solr_path }}/bin/solr.in.sh", dest: "{{ solr_var_path }}/solr.in.sh" }

- name: Configure Solr start config file
  become: yes
  lineinfile:
    path: "{{ solr_var_path }}/solr.in.sh"
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: SOLR_PID_DIR, value: "{{ solr_var_path }}" }
    - { key: SOLR_HOME, value: "{{ solr_var_path }}/data" }
    - { key: SOLR_LOGS_DIR, value: /var/log/solr }
    - { key: SOLR_PORT, value: "{{ solr_port }}" }
  notify: restart

- name: Set Solr Cloud mode
  become: yes
  lineinfile:
    path: "{{ solr_var_path }}/solr.in.sh"
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: SOLR_MODE, value: solrcloud }
    - { key: ZK_HOST, value: '"localhost:2181"' }
  when: solr_cloud_mode == '1'
  notify: restart

- name: Install systemd unit
  become: yes
  template: src=solr.service.j2 dest=/etc/systemd/system/solr.service mode=0644
  notify: restart

- name: Ensure Solr is started and enabled
  become: yes
  systemd: name=solr state=started enabled=yes daemon_reload=yes
